name: 🔍 CI - Build & Deploy Gate

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🏗️ Build & Validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'yarn'
      
      - name: Install dependencies
        run: |
          echo "� Installing dependencies..."
          yarn install --frozen-lockfile
      
      - name: Build React app
        run: |
          echo "🏗️  Building React app..."
          yarn build
      
      - name: Verify build output
        run: |
          echo "✅ Verifying build artifacts..."
          if [ ! -d "build" ]; then
            echo "❌ Build directory not created"
            exit 1
          fi
          if [ ! -f "build/index.html" ]; then
            echo "❌ build/index.html not found"
            exit 1
          fi
          echo "✅ Build successful"

  validate:
    runs-on: ubuntu-latest
    name: ✅ Configuration Check
    steps:
      - uses: actions/checkout@v4
      
      - name: Check critical files
        run: |
          echo "🔍 Checking critical files..."
          files=("Dockerfile" "server.js" "download.py" ".env.production" "package.json" "yarn.lock")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done
      
      - name: Validate Dockerfile
        run: |
          echo "🔍 Validating Dockerfile..."
          if ! grep -q "FROM node:18" Dockerfile; then
            echo "❌ Wrong Node.js version in Dockerfile"
            exit 1
          fi
          if ! grep -q "yarn build" Dockerfile; then
            echo "❌ Missing 'yarn build' in Dockerfile"
            exit 1
          fi
          echo "✅ Dockerfile valid"
      
      - name: Validate server.js
        run: |
          echo "🔍 Validating server.js..."
          if ! grep -q "process.env.PORT" server.js; then
            echo "❌ Missing PORT env var in server.js"
            exit 1
          fi
          if ! grep -q "express.static" server.js; then
            echo "❌ Missing static file serving"
            exit 1
          fi
          echo "✅ server.js valid"
      
      - name: Validate .env.production
        run: |
          echo "🔍 Validating .env.production..."
          required_vars=("NODE_ENV" "PORT" "SPOTIFY_CLIENT_ID" "REACT_APP_SPOTIFY_CLIENT_ID")
          for var in "${required_vars[@]}"; do
            if grep -q "$var" .env.production; then
              echo "✅ $var configured"
            else
              echo "❌ Missing: $var"
              exit 1
            fi
          done
      
      - name: Check for hardcoded localhost
        run: |
          echo "🔍 Checking for hardcoded localhost..."
          if grep -r "localhost:3001" src/ 2>/dev/null; then
            echo "❌ Found hardcoded localhost:3001"
            exit 1
          fi
          echo "✅ No hardcoded localhost URLs"

  security:
    runs-on: ubuntu-latest
    name: � Security Check
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -r "SPOTIFY_CLIENT_SECRET.*=" src/ 2>/dev/null | grep -v "process.env"; then
            echo "❌ Found hardcoded SPOTIFY_CLIENT_SECRET!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
      
      - name: Check for dangerous patterns
        run: |
          echo "🔍 Checking for dangerous code..."
          if grep -r "eval(" src/ server.js 2>/dev/null; then
            echo "❌ Found eval() usage"
            exit 1
          fi
          echo "✅ No dangerous patterns found"

  summary:
    runs-on: ubuntu-latest
    name: 📋 Summary
    needs: [build, validate, security]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=========================================="
          echo "✅ BUILD: ${{ needs.build.result }}"
          echo "✅ VALIDATE: ${{ needs.validate.result }}"
          echo "� SECURITY: ${{ needs.security.result }}"
          echo "=========================================="
          
          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.security.result }}" = "success" ]; then
            echo "🎉 ALL CHECKS PASSED - READY TO DEPLOY"
            exit 0
          else
            echo "❌ SOME CHECKS FAILED"
            exit 1
          fi
