name: CI - Test & Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Check TypeScript compilation
        run: yarn build --noEmit || npx tsc --noEmit
        continue-on-error: true
      
      - name: Lint code
        run: yarn lint
        continue-on-error: true
      
      - name: Build React app
        run: yarn build
      
      - name: Verify build output
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not created"
            exit 1
          fi
          if [ ! -f "build/index.html" ]; then
            echo "❌ build/index.html not found"
            exit 1
          fi
          echo "✅ Build verification passed"
      
      - name: Validate Dockerfile
        run: |
          docker build --dry-run -t exportify:test .
        continue-on-error: true
      
      - name: Check critical files
        run: |
          echo "Checking critical files..."
          files=("Dockerfile" "server.js" "download.py" ".env.production" "package.json" "yarn.lock")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done
      
      - name: Verify no hardcoded localhost in source
        run: |
          echo "Checking for hardcoded localhost URLs in source..."
          if grep -r "localhost:3001" src/ 2>/dev/null; then
            echo "❌ Found hardcoded localhost URLs in src/"
            exit 1
          fi
          echo "✅ No hardcoded localhost URLs found"
        continue-on-error: true
      
      - name: Verify Spotify config
        run: |
          echo "Checking Spotify configuration..."
          if grep -q "REACT_APP_SPOTIFY_CLIENT_ID" .env.production; then
            echo "✅ Spotify Client ID env var found"
          else
            echo "❌ Spotify Client ID not configured"
            exit 1
          fi
      
      - name: Verify production env vars
        run: |
          echo "Checking production environment..."
          required_vars=("NODE_ENV" "PORT" "HOST")
          for var in "${required_vars[@]}"; do
            if grep -q "$var" .env.production; then
              echo "✅ $var configured"
            else
              echo "❌ $var missing from .env.production"
              exit 1
            fi
          done
      
      - name: ✅ All checks passed
        run: echo "Ready for deployment to Render.com"

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ CI passed - Safe to deploy"
            exit 0
          else
            echo "❌ CI failed - Fix issues before deploying"
            exit 1
          fi
