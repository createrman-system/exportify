name: 🔍 CI - Deploy Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: ✅ Validate Configuration
    steps:
      - uses: actions/checkout@v4
      
      - name: Check critical files
        run: |
          echo "🔍 Checking critical files..."
          files=("Dockerfile" "server.js" "download.py" ".env.production" "package.json" "yarn.lock")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ MISSING: $file"
              exit 1
            fi
          done
      
      - name: Validate Dockerfile
        run: |
          echo "🔍 Validating Dockerfile..."
          if ! grep -q "FROM node:18" Dockerfile; then
            echo "❌ Wrong Node.js version"
            exit 1
          fi
          if ! grep -q "yarn build" Dockerfile; then
            echo "❌ Missing yarn build step"
            exit 1
          fi
          echo "✅ Dockerfile OK"
      
      - name: Validate server.js
        run: |
          echo "🔍 Validating server.js..."
          if ! grep -q "process.env.PORT" server.js; then
            echo "❌ Missing PORT env var"
            exit 1
          fi
          if ! grep -q "express.static" server.js; then
            echo "❌ Missing static file serving"
            exit 1
          fi
          echo "✅ server.js OK"
      
      - name: Validate .env.production
        run: |
          echo "🔍 Validating .env.production..."
          if ! grep -q "NODE_ENV" .env.production; then
            echo "❌ Missing NODE_ENV"
            exit 1
          fi
          if ! grep -q "PORT" .env.production; then
            echo "❌ Missing PORT"
            exit 1
          fi
          if ! grep -q "SPOTIFY_CLIENT_ID" .env.production; then
            echo "❌ Missing SPOTIFY_CLIENT_ID"
            exit 1
          fi
          echo "✅ .env.production OK"
      
      - name: Check for hardcoded localhost
        run: |
          echo "🔍 Checking for hardcoded localhost..."
          if grep -r "localhost:3001" src/ 2>/dev/null; then
            echo "❌ Found hardcoded localhost:3001"
            exit 1
          fi
          echo "✅ No hardcoded localhost"

  security:
    runs-on: ubuntu-latest
    name: 🔐 Security Scan
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -r "SPOTIFY_CLIENT_SECRET.*=" src/ 2>/dev/null | grep -v "process.env"; then
            echo "❌ Found hardcoded SPOTIFY_CLIENT_SECRET"
            exit 1
          fi
          echo "✅ No hardcoded secrets"
      
      - name: Check for eval()
        run: |
          echo "🔍 Checking for eval()..."
          if grep -r "eval(" src/ server.js 2>/dev/null; then
            echo "❌ Found eval() usage"
            exit 1
          fi
          echo "✅ No eval() found"

  summary:
    runs-on: ubuntu-latest
    name: 📋 Summary
    needs: [validate, security]
    if: always()
    steps:
      - name: Final Check
        run: |
          echo "✅ VALIDATE: ${{ needs.validate.result }}"
          echo "🔐 SECURITY: ${{ needs.security.result }}"
          
          if [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.security.result }}" = "success" ]; then
            echo "🎉 ALL CHECKS PASSED - READY FOR DEPLOYMENT"
            exit 0
          else
            echo "❌ CHECKS FAILED"
            exit 1
          fi
