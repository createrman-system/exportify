# fly.toml app configuration file generated for exportify on 2026-10-29T16:38:33Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "exportify"
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 100

  [http_service.checks.status]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[deploy]
  strategy = 'immediate'
